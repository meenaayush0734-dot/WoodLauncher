name: Build WoodLauncher APK

on:
workflow_dispatch:
push:
branches: [ "main" ]

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'
- name: Extract project ZIP
    run: |
      ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
      if [ -z "$ZIP" ]; then echo "Project ZIP not found"; exit 1; fi
      unzip -o "$ZIP" -d extracted
      find extracted -name '*.zip' -delete
  - name: Build APK
    run: gradle assembleDebug

  - uses: actions/upload-artifact@v4
    with:
      name: WoodLauncher-debug-apk
      path: app/build/outputs/apk/debug/app-debug.apk
